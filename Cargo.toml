[workspace]
resolver = "3"
members = [
  "crates/clients-runtime",
  "crates/clients-ipc",
  "crates/clients-platform",
  "crates/clients-testkit",
  "desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/BerryUIKI/bluewhale_clients"
homepage = "https://github.com/BerryUIKI/bluewhale_clients"
authors = ["Bluewhale contributors"]

[workspace.dependencies]
clients-runtime = { version = "0.1.0", path = "crates/clients-runtime" }
clients-ipc = { version = "0.1.0", path = "crates/clients-ipc" }
clients-platform = { version = "0.1.0", path = "crates/clients-platform" }
clients-testkit = { version = "0.1.0", path = "crates/clients-testkit" }

# Core crates are consumed from the public repository at a full revision. The
# revision and the corresponding tag are recorded in docs/development/core-pin.md.
core-application = { version = "0.1.0", git = "https://github.com/BerryUIKI/bluewhale_core", rev = "184f2887bcc60dc6fd140cc3c90cc5c9b5168ff4" }
core-crypto = { version = "0.1.0", git = "https://github.com/BerryUIKI/bluewhale_core", rev = "184f2887bcc60dc6fd140cc3c90cc5c9b5168ff4" }
core-domain = { version = "0.1.0", git = "https://github.com/BerryUIKI/bluewhale_core", rev = "184f2887bcc60dc6fd140cc3c90cc5c9b5168ff4" }
core-persistence = { version = "0.1.0", git = "https://github.com/BerryUIKI/bluewhale_core", rev = "184f2887bcc60dc6fd140cc3c90cc5c9b5168ff4" }
core-sync = { version = "0.1.0", git = "https://github.com/BerryUIKI/bluewhale_core", rev = "184f2887bcc60dc6fd140cc3c90cc5c9b5168ff4" }
core-testkit = { version = "0.1.0", git = "https://github.com/BerryUIKI/bluewhale_core", rev = "184f2887bcc60dc6fd140cc3c90cc5c9b5168ff4" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Application size and startup follow the Tauri guidance; the workspace has no
# library crates that need unwinding in release builds.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

