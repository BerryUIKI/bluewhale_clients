[package]
name = "bluewhale-desktop"
description = "Bluewhale Windows desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name on
# Windows; see https://github.com/rust-lang/cargo/issues/8519.
name = "bluewhale_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
clients-ipc.workspace = true
clients-platform.workspace = true
clients-runtime.workspace = true
tauri = { version = "2.12.7", features = [] }
tauri-plugin-single-instance = "2.5.5"

[lints]
workspace = true
