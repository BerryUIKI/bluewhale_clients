name: Feature request
description: Propose a client capability or behavior change.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Behavior and schema changes need an approved design before implementation.
        Link the relevant design document or open a design-decision issue first.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What problem should this solve, for whom, and why now?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design reference
      description: Link the product spec, client design, or ADR section that covers this change.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable behavior, keyboard and screen-reader expectations, and the tests that prove it.
    validations:
      required: true
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: This affects Windows, Android, or both.
        - label: This changes a user-visible string that needs translation.
        - label: This changes the IPC boundary or the core contract.
