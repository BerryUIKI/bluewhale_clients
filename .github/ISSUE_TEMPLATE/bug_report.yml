name: Bug report
description: Report a reproducible defect in a Bluewhale client.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real financial data, credentials, keys, ciphertext, or signing material.
        Security vulnerabilities must be reported privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Android
        - Shared UI
        - Build or tooling
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error codes; remove identifiers, amounts, and personal data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: For example Windows 11 24H2 with WebView2 136, or Android 14 on a Pixel 8.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have not included real financial data, credentials, keys, ciphertext, or signing material.
          required: true
        - label: This is not a security vulnerability.
          required: true
